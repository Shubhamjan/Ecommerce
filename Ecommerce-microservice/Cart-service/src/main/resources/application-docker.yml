spring:
  application:
    name: Cart-Service

  mvc:
    async:
      request-timeout: 30000

  datasource:
    url: jdbc:mysql://host.docker.internal:3306/Cart_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: root
    password: Shubham@242#

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
    redis:
      host: redis
      port: 6379

server:
  port: 8087

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
    registry-fetch-interval-seconds: 5

  instance:
    prefer-ip-address: true

logging:
  level:
    feign: DEBUG
    org.springframework.cloud.openfeign: DEBUG

resilience4j:
  circuitbreaker:
    instances:
      productService:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: tru