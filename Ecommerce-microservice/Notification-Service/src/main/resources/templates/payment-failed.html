<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; }
        .container { max-width: 600px; margin: 30px auto;
                     background: white; border-radius: 8px; padding: 30px; }
        .header { background: #f44336; color: white;
                  padding: 20px; border-radius: 8px 8px 0 0;
                  text-align: center; }
        .content { padding: 20px; }
        .payment-info { background: #fff3f3; padding: 15px;
                        border-radius: 5px; margin: 15px 0;
                        border-left: 4px solid #f44336; }
        .retry-btn { display: inline-block; background: #f44336;
                     color: white; padding: 12px 24px;
                     border-radius: 5px; text-decoration: none;
                     margin-top: 15px; }
        .footer { text-align: center; color: #888;
                  font-size: 12px; margin-top: 20px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>❌ Payment Failed</h2>
        <p th:text="${appName}">ShopApp</p>
    </div>
    <div class="content">
        <p>Hi there,</p>
        <p>Unfortunately your payment could not be processed.</p>

        <div class="payment-info">
            <p><strong>Order Number:</strong>
                <span th:text="${orderNumber}"></span></p>
            <p><strong>Amount:</strong>
                ₹<span th:text="${amount}"></span></p>
            <p><strong>Reason:</strong>
                <span th:text="${failureReason}"></span></p>
        </div>

        <p>Please try again by visiting your orders page.</p>
    </div>
    <div class="footer">
        <p th:text="${appName} + ' — Please contact support if issue persists.'"></p>
    </div>
</div>
</body>
</html>
